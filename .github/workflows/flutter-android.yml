name: Flutter Android APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-android:
    name: Test and build Flutter APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('flutter_app/pubspec.lock') }}

      - name: Generate Android platform files
        run: flutter create --platforms=android --org=com.garua --project-name=garua_engine .

      - name: Ensure Android internet permission and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('    <application', permission + '    <application', 1)
          text = text.replace('android:label="garua_engine"', 'android:label="Garua Engine"')
          path.write_text(text)
          PY

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format --set-exit-if-changed lib test

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Test Flutter app
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: Garua-Engine-Flutter-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
